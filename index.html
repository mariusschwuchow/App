<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6feb">
  <title>Standort-Bewertung</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <div id="status" class="status">Standort wird ermittelt …</div>

  <div id="bottom-bar" class="bottom-bar">
    <button id="pick-button" class="pick-button">Ort wählen</button>
    <button id="rate-button" class="rate-button" disabled aria-haspopup="true" aria-expanded="false">
      Standort bewerten
    </button>
  </div>

  <div id="crosshair" class="crosshair" hidden aria-hidden="true"></div>

  <div id="pick-bar" class="pick-bar" hidden>
    <p>Karte verschieben, bis das Kreuz auf dem Ort liegt, an dem du warst.</p>
    <div class="pick-actions">
      <button id="pick-cancel" class="secondary">Abbrechen</button>
      <button id="pick-confirm">Hier markieren</button>
    </div>
  </div>

  <div id="rating-menu" class="rating-menu" hidden role="menu" aria-label="Bewertung auswählen">
    <label id="visit-date-field" class="visit-date-field" hidden>
      <span id="visit-date-label">Wann warst du dort? <span class="muted">(optional)</span></span>
      <input id="visit-date" type="date">
      <span class="time-row">Uhrzeit <span class="muted">(optional)</span>
        <input id="visit-time" type="time"></span>
    </label>
    <button role="menuitem" data-rating="sehr-gut">Sehr gut</button>
    <button role="menuitem" data-rating="gut">Gut</button>
    <button role="menuitem" data-rating="mittel">Mittel</button>
    <button role="menuitem" data-rating="schlecht">Schlecht</button>
    <button class="cancel" data-cancel>Abbrechen</button>
  </div>

  <button id="backup-toggle" class="backup-toggle" aria-expanded="false" aria-controls="backup-panel"
          title="Menü">&#9776;</button>

  <div id="backup-panel" class="backup-panel" hidden>
    <button id="analysis-open" class="analysis-open">Spot-Analyse: Wohin heute?</button>
    <h2>Meine Daten</h2>
    <p id="backup-info"></p>
    <button id="export-button">Sicherung herunterladen</button>
    <label class="import-label">
      Sicherung wiederherstellen
      <input id="import-input" type="file" accept="application/json,.json">
    </label>
  </div>

  <section id="analysis" class="analysis" hidden aria-label="Spot-Analyse">
    <header class="analysis-header">
      <h2>Spot-Analyse</h2>
      <button id="analysis-close" class="analysis-close" aria-label="Schließen">&times;</button>
    </header>
    <p class="analysis-intro">Spots, an denen es bei ähnlichem Wetter wie in der Vorhersage gut lief.
      Verglichen wird jeweils zur Uhrzeit deiner früheren Besuche.</p>
    <div id="analysis-days" class="analysis-days"></div>
    <div id="analysis-fish" class="fish-chips analysis-fish"></div>
    <div id="analysis-list" class="analysis-list"></div>
  </section>

  <div id="toast" class="toast" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="moon.js"></script>
  <script src="conditions.js"></script>
  <script src="app.js"></script>
  <script src="analysis.js"></script>
</body>
</html>
