<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6feb">
  <title>Standort-Bewertung</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <div id="status" class="status">Standort wird ermittelt …</div>

  <button id="rate-button" class="rate-button" disabled aria-haspopup="true" aria-expanded="false">
    Standort bewerten
  </button>

  <div id="rating-menu" class="rating-menu" hidden role="menu" aria-label="Bewertung auswählen">
    <button role="menuitem" data-rating="sehr-gut">Sehr gut</button>
    <button role="menuitem" data-rating="gut">Gut</button>
    <button role="menuitem" data-rating="mittel">Mittel</button>
    <button role="menuitem" data-rating="schlecht">Schlecht</button>
    <button class="cancel" data-cancel>Abbrechen</button>
  </div>

  <button id="backup-toggle" class="backup-toggle" aria-expanded="false" aria-controls="backup-panel"
          title="Daten sichern">&#9776;</button>

  <div id="backup-panel" class="backup-panel" hidden>
    <h2>Meine Daten</h2>
    <p id="backup-info"></p>
    <button id="export-button">Sicherung herunterladen</button>
    <label class="import-label">
      Sicherung wiederherstellen
      <input id="import-input" type="file" accept="application/json,.json">
    </label>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="conditions.js"></script>
  <script src="app.js"></script>
</body>
</html>
